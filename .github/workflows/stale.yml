name: Triage inactive work

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close inactive issues and pull requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >-
            This issue has been inactive for 60 days. Add current details or remove the
            stale label to keep it open; otherwise it will close in 14 days.
          close-issue-message: >-
            Closing after the inactivity notice. Reopen the issue with updated details
            if the problem is still reproducible.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request has been inactive for 30 days. Push an update or remove
            the stale label to keep it open; otherwise it will close in 14 days.
          close-pr-message: >-
            Closing after the inactivity notice. The branch and commits remain available
            if work resumes later.
          exempt-issue-labels: pinned,security,never-stale
          exempt-pr-labels: pinned,security,never-stale,work-in-progress
          remove-stale-when-updated: true
          operations-per-run: 100
