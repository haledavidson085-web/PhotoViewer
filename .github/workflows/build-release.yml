name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.rid }} / ${{ matrix.package_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            package_type: framework-dependent
            self_contained: false
          - rid: win-x64
            package_type: self-contained
            self_contained: true
          - rid: win-arm64
            package_type: framework-dependent
            self_contained: false
          - rid: win-arm64
            package_type: self-contained
            self_contained: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish and package
        id: package
        shell: pwsh
        run: |
          $packageName = "PhotoViewer-${{ matrix.rid }}-${{ matrix.package_type }}"
          $publishPath = Join-Path $env:RUNNER_TEMP $packageName
          $archivePath = Join-Path $PWD "$packageName.zip"

          dotnet publish PhotoViewer.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained "${{ matrix.self_contained }}" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Compress-Archive -Path "$publishPath\*" -DestinationPath $archivePath
          "archive_path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish_path=$publishPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke test startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $executable = Join-Path "${{ steps.package.outputs.publish_path }}" "PhotoViewer.exe"
          $process = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3

          if ($process.HasExited) {
            throw "PhotoViewer exited during startup with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id
          $process.WaitForExit()

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: PhotoViewer-${{ matrix.rid }}-${{ matrix.package_type }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: PhotoViewer-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release-assets -Filter *.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release-assets/SHA256SUMS.txt

      - name: Publish or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem release-assets -File | Sort-Object Name
          gh release view "$env:GITHUB_REF_NAME" *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $assets.FullName --clobber
          }
          else {
            gh release create "$env:GITHUB_REF_NAME" $assets.FullName `
              --title "Photo Viewer $env:GITHUB_REF_NAME" `
              --generate-notes `
              --verify-tag
          }
